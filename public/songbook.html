<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0907">
<link rel="canonical" href="https://timemachineent.com/songbook">
<meta name="description" content="Search the Time Machine Live Band Karaoke songbook, then sign up at the stage.">
<title>Live Band Karaoke Songbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
:root { --bg:#0c0907; --panel:#1b1410; --line:#3a2a1f; --fg:#fbf3ea; --muted:#c9b8a4; --gold:#ffcf40; --warm:linear-gradient(90deg,#d9541e,#ff8a1f,#ffcf40); }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:Barlow, system-ui, sans-serif; font-size:17px; line-height:1.4; }
.top { text-align:center; padding:26px 16px 18px; background:radial-gradient(700px 320px at 50% 0%, rgba(255,138,31,.22), transparent 70%); }
.top img { width:132px; height:132px; display:block; margin:0 auto 12px; filter:drop-shadow(0 8px 24px rgba(255,138,31,.25)); }
h1 { font-family:Anton, Impact, sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(2.2rem,10vw,3.6rem); line-height:.95; margin:0; letter-spacing:.01em; }
h1 span { background:var(--warm); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub { color:var(--muted); margin:8px 0 0; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:.85rem; }
.newsongs { margin:8px 0 0; color:var(--gold); font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:.85rem; }
.how { max-width:640px; margin:18px auto 0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; text-align:left; }
.how div { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
.how b { display:block; font-family:Anton, Impact, sans-serif; font-weight:400; font-size:1.5rem; line-height:1; background:var(--warm); -webkit-background-clip:text; background-clip:text; color:transparent; }
.how span { font-size:.95rem; color:var(--fg); }
.stage { max-width:640px; margin:12px auto 0; background:var(--warm); color:#1a0d05; border-radius:14px; padding:14px 16px; font-weight:700; font-size:.98rem; line-height:1.35; }
.stage .big { display:block; font-family:Anton, Impact, sans-serif; font-weight:400; text-transform:uppercase; font-size:1.6rem; line-height:1.05; letter-spacing:.01em; margin-bottom:6px; }
.how strong { color:var(--gold); }
.bar { position:sticky; top:0; z-index:5; background:rgba(12,9,7,.96); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:10px 16px; }
.mini { display:none; align-items:center; gap:10px; margin-bottom:9px; }
.mini img { width:42px; height:42px; flex:none; }
.mini b { display:block; font-family:Anton, Impact, sans-serif; font-weight:400; text-transform:uppercase; font-size:1.35rem; line-height:1; }
.mini b span { background:var(--warm); -webkit-background-clip:text; background-clip:text; color:transparent; }
.mini em { display:block; font-style:normal; font-weight:800; font-size:.82rem; letter-spacing:.05em; text-transform:uppercase; color:var(--gold); margin-top:3px; }
.bar.stuck .mini { display:flex; }
.bar .in { max-width:640px; margin:0 auto; }
.bar input { width:100%; font:inherit; font-size:1.05rem; padding:13px 16px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); -webkit-appearance:none; }
.bar input:focus { outline:2px solid var(--gold); outline-offset:1px; }
.bar input::placeholder { color:var(--muted); }
.ctl { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:9px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
.seg button { font:inherit; font-weight:800; font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; padding:7px 14px; background:transparent; color:var(--muted); border:0; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--warm); color:#1a0d05; }
.count { color:var(--muted); font-size:.85rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-variant-numeric:tabular-nums; }
main { max-width:640px; margin:0 auto; padding:6px 16px 60px; }
.letter { font-family:Anton, Impact, sans-serif; font-weight:400; font-size:1.4rem; color:var(--gold); padding:16px 4px 4px; border-bottom:1px solid var(--line); }
ul { list-style:none; margin:0; padding:0; }
li { padding:11px 4px; border-bottom:1px solid rgba(255,255,255,.06); }
li .t { display:block; font-weight:700; font-size:1.05rem; }
li .a { display:block; color:var(--muted); font-size:.92rem; }
mark { background:rgba(255,207,64,.28); color:inherit; border-radius:3px; }
.none { text-align:center; color:var(--muted); padding:40px 10px; }
.none b { color:var(--fg); }
.foot { position:fixed; left:0; right:0; bottom:0; z-index:5; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:rgba(12,9,7,.96); border-top:1px solid var(--line); text-align:center; font-weight:800; letter-spacing:.05em; text-transform:uppercase; font-size:.9rem; }
.foot span { background:var(--warm); -webkit-background-clip:text; background-clip:text; color:transparent; }
.credit { text-align:center; color:var(--muted); font-size:.85rem; padding:28px 0 0; }
.credit a { color:var(--fg); }
</style>
</head>
